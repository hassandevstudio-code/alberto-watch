<!DOCTYPE html>
<html lang="en" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Alberto Watch Company</title>
<meta name="description" content="Sign in to your Alberto account.">
<meta name="theme-color" content="#102B23">
<link rel="canonical" href="https://www.albertowatch.example/pages/login.html">
<meta property="og:type" content="website"><meta property="og:site_name" content="Alberto Watch Company">
<meta property="og:title" content="Login | Alberto Watch Company"><meta property="og:description" content="Sign in to your Alberto account.">
<meta property="og:image" content="https://www.albertowatch.example/images/e1.webp"><meta property="og:url" content="https://www.albertowatch.example/pages/login.html">
<link rel="icon" href="../images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/bootstrap.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="login">
<script>try{if(localStorage.getItem("alb_dark")==="1")document.body.classList.add("dark")}catch(e){}</script>
<main id="main" tabindex="-1">
<section class="page active" id="login" aria-label="Login">
<h2 role="heading" aria-level="1" class="visually-hidden">Login</h2>
<div id="lampStage" class="lamp-stage" data-lamp="off">
 <div class="wall" aria-hidden="true"></div>
 <div class="lg-lampbox">
  <div class="scene" id="scene">

    <!-- Light layers (all driven by CSS variables set from app.js) -->
    <div class="glow ambient" aria-hidden="true"></div>
    <div class="glow cone-wide" aria-hidden="true"><b><i></i></b></div>
    <div class="glow cone" aria-hidden="true"><b><i></i></b></div>
    <div class="glow cone-up" aria-hidden="true"><b><i></i></b></div>
    <div class="glow floor-pool" aria-hidden="true"></div>

    <!-- The lamp itself: one inline SVG, viewBox 440 x 790 -->
    <svg id="lampSvg" class="lamp" viewBox="0 0 440 790" xmlns="http://www.w3.org/2000/svg"
         role="group" aria-label="Table lamp with a tapered shade, thin dark pole, brass ring and a hanging pull cord">
      <defs>
        <!-- ===== shade ===== -->
        <linearGradient id="gShadeOff" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#15110e"/>
          <stop offset=".28" stop-color="#2d2822"/>
          <stop offset=".5" stop-color="#3a342b"/>
          <stop offset=".74" stop-color="#231e19"/>
          <stop offset="1" stop-color="#0e0b09"/>
        </linearGradient>
        <linearGradient id="gShadeOn" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#c47a3c"/>
          <stop offset=".16" stop-color="#eaa968"/>
          <stop offset=".42" stop-color="#ffdcaa"/>
          <stop offset=".6" stop-color="#fbd29a"/>
          <stop offset=".84" stop-color="#e6a463"/>
          <stop offset="1" stop-color="#b56a32"/>
        </linearGradient>
        <linearGradient id="gShadeTop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6a3512" stop-opacity=".2"/>
          <stop offset=".55" stop-color="#6a3512" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="gShadeCore" cx=".5" cy="1" r=".8">
          <stop offset="0" stop-color="#fff2d4" stop-opacity=".95"/>
          <stop offset=".5" stop-color="#ffdca8" stop-opacity=".35"/>
          <stop offset="1" stop-color="#ffd09a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gShadeEdge" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#000" stop-opacity=".38"/>
          <stop offset=".22" stop-color="#000" stop-opacity="0"/>
          <stop offset=".72" stop-color="#000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".42"/>
        </linearGradient>
        <radialGradient id="gOpenOn" cx=".5" cy=".5" r=".6">
          <stop offset="0" stop-color="#fff0c8"/>
          <stop offset="1" stop-color="#f1b068"/>
        </radialGradient>
        <!-- very fine fabric weave, deliberately subtle (real texture is not visible in the reference) -->
        <pattern id="pWeave" width="3" height="3" patternUnits="userSpaceOnUse">
          <path d="M0 .5H3M.5 0V3" stroke="#fff" stroke-opacity=".022" stroke-width=".6"/>
        </pattern>

        <!-- ===== metal, brass, bulb ===== -->
        <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#090706"/>
          <stop offset=".34" stop-color="#2f2822"/>
          <stop offset=".46" stop-color="#3d342b"/>
          <stop offset=".76" stop-color="#14100d"/>
          <stop offset="1" stop-color="#070605"/>
        </linearGradient>
        <linearGradient id="gPoleLit" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffb969" stop-opacity=".8"/>
          <stop offset=".3" stop-color="#ff9a48" stop-opacity=".28"/>
          <stop offset=".65" stop-color="#ff9a48" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#3c2810"/>
          <stop offset=".25" stop-color="#8f6527"/>
          <stop offset=".46" stop-color="#f1d07f"/>
          <stop offset=".68" stop-color="#b78534"/>
          <stop offset="1" stop-color="#3a260e"/>
        </linearGradient>
        <radialGradient id="gBulbOff" cx=".4" cy=".35" r=".75">
          <stop offset="0" stop-color="#4a3f35"/>
          <stop offset=".7" stop-color="#1d1814"/>
          <stop offset="1" stop-color="#0f0c0a"/>
        </radialGradient>
        <radialGradient id="gBulbOn" cx=".5" cy=".45" r=".6">
          <stop offset="0" stop-color="#fffef2"/>
          <stop offset=".35" stop-color="#ffe6a8"/>
          <stop offset=".75" stop-color="#ffbe5c"/>
          <stop offset="1" stop-color="#f08a2a"/>
        </radialGradient>
        <radialGradient id="gGlowA">
          <stop offset="0" stop-color="#ffd68c" stop-opacity=".95"/>
          <stop offset=".35" stop-color="#ffaa46" stop-opacity=".45"/>
          <stop offset="1" stop-color="#ff8228" stop-opacity="0"/>
        </radialGradient>

        <!-- ===== base ===== -->
        <linearGradient id="gBase" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#070605"/>
          <stop offset=".3" stop-color="#1d1712"/>
          <stop offset=".46" stop-color="#2d231a"/>
          <stop offset=".78" stop-color="#120e0b"/>
          <stop offset="1" stop-color="#060504"/>
        </linearGradient>

        <filter id="fSoft" x="-20%" y="-300%" width="140%" height="700%">
          <feGaussianBlur stdDeviation="7"/>
        </filter>
      </defs>

      <!-- contact shadow under the base -->
      <ellipse cx="220" cy="757" rx="122" ry="10" fill="#000" opacity=".6" filter="url(#fSoft)"/>

      <!-- ===== pole ===== -->
      <rect x="214.5" y="268" width="11" height="436" fill="url(#gMetal)"/>
      <rect x="214.5" y="268" width="11" height="436" fill="url(#gPoleLit)" class="v-lit"/>

      <!-- ===== socket + bulb (hangs just below the shade rim) ===== -->
      <rect x="208" y="250" width="24" height="24" rx="3" fill="url(#gMetal)"/>
      <ellipse cx="220" cy="236" rx="17" ry="20" fill="url(#gBulbOff)"/>
      <ellipse cx="214" cy="240" rx="3.2" ry="6" fill="#fff" opacity=".08"/>
      <ellipse cx="220" cy="236" rx="17" ry="20" fill="url(#gBulbOn)" class="v-bulb"/>

      <!-- ===== pull cord (interactive) ===== -->
      <g id="cord" tabindex="0" role="switch" aria-checked="false"
         aria-label="Lamp pull cord. Press Enter or Space to pull.">
        <path id="cordHit" d="M246,222 L246,398" fill="none" stroke="rgba(0,0,0,0)" stroke-width="30"
              stroke-linecap="round" pointer-events="stroke"/>
        <path id="cordDim" d="M246,222 L246,398" fill="none" stroke="#5a4d3d" stroke-width="1.9" stroke-linecap="round"/>
        <path id="cordLit" d="M246,222 L246,398" fill="none" stroke="#f4dfb6" stroke-width="1.9" stroke-linecap="round" class="v-lit"/>
        <g id="bead" transform="translate(246 398)">
          <circle cx="0" cy="8" r="26" fill="rgba(0,0,0,0)" pointer-events="all"/>
          <g class="bead-inner">
            <ellipse cx="0" cy="2" rx="2.8" ry="2.4" fill="url(#gBrass)"/>
            <ellipse cx="0" cy="10" rx="5.2" ry="7.4" fill="url(#gBrass)"/>
            <ellipse cx="-1.6" cy="7.6" rx="1.4" ry="2.6" fill="#fff3c8" opacity=".5"/>
            <ellipse cx="0" cy="10" rx="5.2" ry="7.4" fill="#000" class="v-unlit-half"/>
          </g>
          <circle class="focus-ring" cx="0" cy="9" r="17"/>
        </g>
      </g>

      <!-- ===== shade (tapered drum, seen slightly from above) ===== -->
      <g id="shade">
        <path id="shadeBody" d="M142,40 L92,206 A128,18 0 0 0 348,206 L298,40 A78,9 0 0 0 142,40 Z" fill="url(#gShadeOff)"/>
        <path d="M142,40 L92,206 A128,18 0 0 0 348,206 L298,40 A78,9 0 0 0 142,40 Z" fill="url(#pWeave)"/>
        <g class="v-lit">
          <path d="M142,40 L92,206 A128,18 0 0 0 348,206 L298,40 A78,9 0 0 0 142,40 Z" fill="url(#gShadeOn)"/>
          <path d="M142,40 L92,206 A128,18 0 0 0 348,206 L298,40 A78,9 0 0 0 142,40 Z" fill="url(#gShadeTop)"/>
          <path d="M142,40 L92,206 A128,18 0 0 0 348,206 L298,40 A78,9 0 0 0 142,40 Z" fill="url(#gShadeCore)"/>
        </g>
        <!-- cylindrical edge shading, always on -->
        <path d="M142,40 L92,206 A128,18 0 0 0 348,206 L298,40 A78,9 0 0 0 142,40 Z" fill="url(#gShadeEdge)"/>
        <!-- top opening -->
        <ellipse cx="220" cy="40" rx="77" ry="8.2" fill="#0b0908"/>
        <ellipse cx="220" cy="40" rx="77" ry="8.2" fill="url(#gOpenOn)" class="v-lit"/>
        <path d="M142,40 A78,9 0 0 0 298,40" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1.6"/>
        <path d="M142,40 A78,9 0 0 0 298,40" fill="none" stroke="#ffe3b2" stroke-width="1.6" class="v-rim"/>
        <!-- bottom rim: faint when off, bright when lit -->
        <path d="M92,206 A128,18 0 0 0 348,206" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="2"/>
        <path d="M92,206 A128,18 0 0 0 348,206" fill="none" stroke="#fff0cf" stroke-width="2.4" stroke-linecap="round" class="v-rim"/>
      </g>

      <!-- bulb glow (spills over shade rim, socket and cord top) -->
      <g pointer-events="none" class="v-bulb">
        <circle cx="220" cy="240" r="112" fill="url(#gGlowA)"/>
        <circle cx="220" cy="238" r="40" fill="url(#gGlowA)"/>
      </g>

      <!-- ===== brass ring on the pole ===== -->
      <g id="ring">
        <rect x="210" y="462" width="20" height="10" rx="2.5" fill="url(#gBrass)"/>
        <rect x="208" y="459.5" width="24" height="3.4" rx="1.7" fill="url(#gBrass)"/>
        <rect x="208" y="471.2" width="24" height="3.4" rx="1.7" fill="url(#gBrass)"/>
        <rect x="208" y="459.5" width="24" height="15" rx="2.5" fill="#000" class="v-unlit-half"/>
      </g>

      <!-- ===== base: dark circular foot ===== -->
      <path d="M128,742 C134,726 166,716 200,711 L205,696 L235,696 L240,711 C274,716 306,726 312,742 A92,15 0 0 1 128,742 Z" fill="url(#gBase)"/>
      <path d="M150,730 C170,719 196,714 214,712" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M128,742 A92,15 0 0 0 312,742" fill="none" stroke="#caa77a" stroke-opacity=".16" stroke-width="1.6"/>
      <path d="M128,742 A92,15 0 0 0 312,742" fill="none" stroke="#ffbe78" stroke-opacity=".55" stroke-width="1.6" class="v-lit"/>

      <text class="hint" x="272" y="404">pull the cord</text>
    </svg>
  </div>
 </div>
 <div class="grain" aria-hidden="true"></div>
 <div class="vignette" aria-hidden="true"></div>
 <div class="lg-side">
  <div class="lg-hint" id="lgHint" aria-hidden="true">Pull the cord to turn on the light<small>and sign in</small></div>
  <div class="lg-card" id="lgCard" inert aria-hidden="true"></div>
 </div>
 <p class="sr-only" id="lampStatus" role="status" aria-live="polite"></p>
</div>
</section>
</main>
<script src="../lib/jquery.min.js"></script>
<script src="../lib/bootstrap.bundle.min.js"></script>
<script src="../data/products.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
